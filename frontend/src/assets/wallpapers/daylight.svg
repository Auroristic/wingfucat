<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <rect width="1920" height="1080" fill="#f8f9fa" />
  <defs>
    <pattern id="daylightDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" fill-opacity="0.45" />
    </pattern>
    <linearGradient id="daylightWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#daylightWash)" />
  <rect width="1920" height="1080" fill="url(#daylightDots)" />
</svg>
